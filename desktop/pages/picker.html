<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; img-src data:">
<title>Share your screen</title>
<style>
  body { margin: 0; background: #1a1816; color: #ece6df; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 18px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #3a3631; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .tab { background: none; border: 0; color: #a49b90; padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
  .tab.on { background: #38342f; color: #ece6df; }
  #grid { flex: 1; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: start; }
  .src { background: #22201d; border: 2px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; }
  .src:hover { border-color: #5a524a; } .src.sel { border-color: #ff7a29; }
  .src img.t { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 6px; }
  .src .n { display: flex; gap: 6px; align-items: center; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src .n img { width: 16px; height: 16px; }
  footer { padding: 12px 18px; border-top: 1px solid #3a3631; display: flex; gap: 10px; align-items: center; }
  footer label { flex: 1; color: #a49b90; } button.b { border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .go { background: #ff7a29; color: #1a1208; } .go:disabled { opacity: .5; } .cancel { background: #38342f; color: #ece6df; }
</style>
</head>
<body>
<header><h1>Share your screen</h1><button class="tab on" data-k="window">Apps &amp; games</button><button class="tab" data-k="screen">Entire screen</button></header>
<div id="grid"></div>
<footer>
  <label id="audioWrap"><input type="checkbox" id="audio" checked> Share sound (game and app audio)</label>
  <button class="b cancel" id="cancel">Cancel</button><button class="b go" id="go" disabled>Go live</button>
</footer>
<script src="picker.js"></script>
</body>
</html>
