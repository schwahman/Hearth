<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'unsafe-inline'; img-src data:">
<title>Hearth</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, #3a2212 0, #121110 55%); color: #ece6df; font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  form { width: min(420px, 90vw); background: #22201d; border: 1px solid #3a3631; border-radius: 16px; padding: 28px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 22px; } p { margin: 0; color: #a49b90; }
  input { background: #121110; border: 1px solid #3a3631; border-radius: 8px; padding: 10px 12px; color: inherit; font: inherit; }
  input:focus { outline: none; border-color: #ff7a29; }
  button { border: 0; border-radius: 8px; padding: 10px; background: #ff7a29; color: #1a1208; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; } .error { color: #e5484d; min-height: 1.2em; font-size: 13px; }
</style>
</head>
<body>
<form id="f">
  <h1>Welcome to Hearth</h1>
  <p>Enter the address of the Hearth server you want to connect to.</p>
  <input id="url" placeholder="chat.example.com" autofocus required>
  <p class="error" id="err"></p>
  <button id="go" type="submit">Connect</button>
</form>
<script src="setup.js"></script>
</body>
</html>
